<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B1020">
  <meta name="description" content="Descubre tu punto de partida y recibe una ruta para comenzar tu primer negocio digital.">
  <title>Tu Primer Negocio Digital · Diagnóstico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Saltar al contenido</a>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="progress-shell" id="progressShell" hidden>
    <div class="progress-meta"><span id="progressText"></span><span id="progressPercent" aria-hidden="true"></span></div>
    <div class="progress-track" aria-hidden="true"><span id="progressFill"></span></div>
  </header>
  <main id="app" tabindex="-1" aria-live="polite"></main>
  <div id="stickyCta" class="sticky-cta" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="fallback" class="fallback-backdrop" hidden></div>
  <noscript><div class="noscript">Necesitas activar JavaScript para completar el diagnóstico.</div></noscript>
  <script src="config.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
  <script src="tests.js"></script>
</body>
</html>
